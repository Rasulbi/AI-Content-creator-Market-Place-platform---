name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Static Analysis, Unit Testing, and Production Build
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run unit and API route test suites
        run: npm run test:unit
        env:
          NODE_ENV: test

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder-project.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder-anon-key' }}

  # ---------------------------------------------------------------------------
  # Job 2: End-to-End Browser Testing in Headless Chromium (Playwright)
  # ---------------------------------------------------------------------------
  e2e-browser-gate:
    name: Playwright E2E Critical Scenarios
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Install Playwright Chromium with OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E browser test suite
        run: npm run test:e2e
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          PLAYWRIGHT_TEST_BASE_URL: "http://localhost:3000"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_CREATOR_EMAIL: ${{ secrets.E2E_TEST_CREATOR_EMAIL }}
          E2E_TEST_CREATOR_PASSWORD: ${{ secrets.E2E_TEST_CREATOR_PASSWORD }}

      - name: Upload Playwright test artifact reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
